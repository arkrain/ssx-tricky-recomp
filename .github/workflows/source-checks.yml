name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pytest==8.4.2
      - run: python scripts/check-public-source.py
      - run: python -m compileall -q scripts tests
      - run: sh -n play scripts/build-linux-container.sh scripts/build-windows-container.sh
      - run: python scripts/pipeline.py bootstrap
      - run: python tests/dsp_source_preparation.py
      - run: python tests/telemetry_clock.py
      - run: python -m pytest -q tests/test_section_tail.py
